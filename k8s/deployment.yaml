# 单 Pod sidecar：API + headless runtime 同 Pod 经 localhost 通信
# replicas 固定 1：session 锁与 session 对象都是进程内的，多副本需要分布式锁 + 共享 Session Registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-server-agent
  labels:
    app: copilot-server-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copilot-server-agent
  template:
    metadata:
      labels:
        app: copilot-server-agent
    spec:
      terminationGracePeriodSeconds: 60
      # 镜像以 USER node(uid/gid 1000) 运行，PVC 挂进来默认属 root → workspace mkdir 会 EACCES。
      # fsGroup=1000 让卷对容器主组可写；OnRootMismatch 避免每次启动全量 chown 大卷。
      # 部署前用 `kubectl exec ... -- id` 确认镜像实际 uid/gid 与此处一致。
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: your-registry/copilot-server-agent:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            # 连同 Pod 内的 runtime sidecar
            - name: COPILOT_RUNTIME_URL
              value: "http://127.0.0.1:4321"
            - name: COPILOT_SESSION_IDLE_TIMEOUT
              value: "1800"
            # 每 session 独立 workspace（独立 PVC，Pod 重启不丢）
            - name: COPILOT_WORKSPACE_ROOT
              value: "/workspaces"
            # Session Registry：归属持久化（重启后不退化成“谁先访问谁认领”）
            - name: COPILOT_REGISTRY_PATH
              value: "/var/lib/copilot/session-registry.json"
            # 身份头只有在网关/IAP 会剥离客户端自带头时才可开启
            - name: COPILOT_TRUST_IDENTITY_HEADERS
              value: "false"
            # bash 授权：命令涉及路径必须在 session workspace 内
            - name: COPILOT_BASH_POLICY
              value: "workspace"
            # 生产安全默认值
            - name: COPILOT_MCP_FILESYSTEM
              value: "false"
            - name: COPILOT_ALLOW_INLINE_MCP_LOCAL
              value: "false"
            - name: COPILOT_ALLOW_INLINE_MCP_HTTP
              value: "false"
            - name: COPILOT_SKILL_ROOTS
              value: "/opt/copilot/skills,/workspace/skills"
            - name: COPILOT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-server-agent
                  key: admin-token
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-server-agent
                  key: github-token
            # Durable state：配了才跨重启存活（execution / human task / approval / event / ownership）
            # 不配则走内存实现，审批中的任务会在 Pod 重启后丢失
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: copilot-server-agent
                  key: database-url
                  optional: true
          volumeMounts:
            # workspace 独立卷（不用 subPath）
            - name: workspaces
              mountPath: /workspaces
            # registry 与 runtime 同卷（同 Pod 同卷，RWO 可用）
            - name: runtime-state
              mountPath: /var/lib/copilot
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3001
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3001
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi

        - name: copilot-runtime
          image: your-registry/copilot-runtime:1.0.14
          args:
            - --headless
            - --host
            - 127.0.0.1
            - --port
            - "4321"
          env:
            - name: COPILOT_HOME
              value: /var/lib/copilot
            - name: COPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-server-agent
                  key: github-token
          ports:
            - containerPort: 4321
          volumeMounts:
            - name: runtime-state
              mountPath: /var/lib/copilot
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi

      volumes:
        - name: runtime-state
          persistentVolumeClaim:
            claimName: copilot-runtime-state
        - name: workspaces
          persistentVolumeClaim:
            claimName: copilot-workspaces
