# Secrets（先创建再部署；示例用 kubectl 创建，不要把 token 写进 git）
#
# 不需要 database-url 就是默认形态：durable state 走 SQLite
# （库文件在 PVC 上，COPILOT_DB_PATH=/var/lib/copilot/agent.db）。
# 只有要切 PostgreSQL 时才追加 database-url，并先应用迁移：
#   psql "$DATABASE_URL" -f server/src/db/migrations/001_agent_execution.sql
#   kubectl create secret generic copilot-server-agent \
#     --from-literal=github-token="$GITHUB_TOKEN" \
#     --from-literal=admin-token="$(openssl rand -hex 32)" \
#     --from-literal=database-url="postgres://user:pass@host:5432/copilot?sslmode=require"
#
# 只补 database-url（secret 已存在时）：
#   kubectl patch secret copilot-server-agent --type merge \
#     -p '{"stringData":{"database-url":"postgres://..."}}'
apiVersion: v1
kind: Secret
metadata:
  name: copilot-server-agent
type: Opaque
stringData:
  # 运行时注入：GITHUB_TOKEN（API 容器）/ COPILOT_GITHUB_TOKEN（runtime 容器）
  github-token: "REPLACE_ME"
  # 管理接口令牌：/api/debug、/api/hooks 需带 x-admin-token: <admin-token>
  admin-token: "REPLACE_ME"
  # database-url 故意不写占位值：key 存在但值非法会让服务进 PG 模式后连不上。
  # 默认不需要它（走 SQLite）；要切 PostgreSQL 再按上面的 kubectl 命令补真实连接串。
