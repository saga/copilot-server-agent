# 两个独立 PVC：runtime 会话状态 与 session workspace 分开（不再用 subPath 拼目录）
# Kubernetes 文档明确提示 subPath 方案不适合生产；拆卷后挂载点就是卷根，权限与扩容都更干净
---
# Runtime 会话持久化（/var/lib/copilot/session-state/<sessionId>）
# 同时存放 durable state 库文件（COPILOT_DB_PATH=/var/lib/copilot/agent.db，默认 SQLite），API 容器也挂这份卷
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copilot-runtime-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Session workspace（/workspaces/<hash>；1 session = 1 目录）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copilot-workspaces
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
